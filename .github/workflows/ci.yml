name: Android CI & Signed APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build KaraokeIEM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare Signing Keystore
        id: keystore
        if: env.HAS_SIGNING_SECRET == 'true'
        env:
          HAS_SIGNING_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/karaoke_iem_ci.p12"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          echo "store_file=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Run DSP & Sync Unit Tests + Build Signed APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          gradle testDebugUnitTest assembleRelease assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/KaraokeIEM-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/KaraokeIEM-debug.apk
          TAG_NAME=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          if [[ -n "$TAG_NAME" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/KaraokeIEM-${TAG_NAME}.apk"
          fi

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeIEM-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach Signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/KaraokeIEM-*.apk
          generate_release_notes: true

name: Android CI & Signed APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build KaraokeIEM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare Persistent Signing Keystore
        id: keystore
        shell: bash
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/karaoke_ci.p12"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \t\r\n' | base64 -d > "$KEYSTORE_FILE"
            echo "store_file=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"
            echo "store_password=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "key_password=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"

            echo "key_password=karaokeiem2026" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests & Build Signed APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          SIGNING_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          SIGNING_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          gradle testDebugUnitTest assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/KaraokeIEM-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/KaraokeIEM-debug.apk
          REL_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$REL_TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REL_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -n "$REL_TAG" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/KaraokeIEM-${REL_TAG}.apk"
          fi

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeIEM-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach Signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/KaraokeIEM-*.apk
          generate_release_notes: true
